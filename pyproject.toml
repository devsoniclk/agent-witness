[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-witness"
version = "0.5.0"
description = "Cryptographic action attestation, MCP server, forensic verification, transparency logs & Merkle audit receipts for autonomous AI agents"
readme = "README.md"
authors = [{ name = "Lakshitha Dananjaya", email = "lakshitha.dananjaya.org@gmail.com" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["ai-agents", "cryptography", "merkle-tree", "attestation", "auditability", "mcp", "model-context-protocol", "solidity", "web3", "receipts", "eip-712", "solana", "transparency-log", "consensus"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
agent-witness = "agent_witness.cli:main"

[project.urls]
Homepage = "https://github.com/devsoniclk/agent-witness"
Repository = "https://github.com/devsoniclk/agent-witness.git"
Issues = "https://github.com/devsoniclk/agent-witness/issues"

[tool.setuptools.packages.find]
include = ["agent_witness*"]
